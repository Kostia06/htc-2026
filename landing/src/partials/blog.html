<section class="section is-blog" data-section="blog" data-section-color="black">
  <div class="container is-big">
    <div class="header-block">
      <div class="section-heading">
        <h2 class="heading-2 text-align-center max-w-55 text-color-white">{{ guides.heading }}</h2>
        <div class="shadow vertical hide"></div>
      </div>
      <div class="collection-news-wrap">
        <div class="collection-list-wrapper-2">
          <div role="list">
            <div role="listitem">
              <div class="blog-feature-link">
                <div class="featured-img-wrap r-guide-art r-guide-art--1" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="news-info">
                  <span class="r-soon">{{ guides.tag }}</span>
                  <h3 class="haeding-blog">{{ guides.cards.0.title }}</h3>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="collection-list-wrapper">
          <div class="blog-home" role="list">
            <div role="listitem">
              <div class="blog-feature-link">
                <div class="blog-news-home-img r-guide-art r-guide-art--2" aria-hidden="true"><span></span><span></span></div>
                <div class="news-info max-w-22-7">
                  <span class="r-soon">{{ guides.tag }}</span>
                  <h3 class="haeding-blog">{{ guides.cards.1.title }}</h3>
                </div>
              </div>
            </div>
            <div role="listitem">
              <div class="blog-feature-link">
                <div class="blog-news-home-img r-guide-art r-guide-art--3" aria-hidden="true"><span></span></div>
                <div class="news-info max-w-22-7">
                  <span class="r-soon">{{ guides.tag }}</span>
                  <h3 class="haeding-blog">{{ guides.cards.2.title }}</h3>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
