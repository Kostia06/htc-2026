<div class="cookies" data-section="cookies">
  <div class="cookie-banner" role="region" aria-label="{{ cookies.label }}" hidden>
    <div class="cookie-banner__content">
      <div class="cookie-banner__container">
        <p class="cookie-banner__text">{{ cookies.text }}</p>
        <div class="cookie-banner__buttons">
          <button class="cookie-banner__button is-alt" type="button" data-cookie="denied">{{ cookies.deny }}</button>
          <button class="cookie-banner__button" type="button" data-cookie="accepted">{{ cookies.accept }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
