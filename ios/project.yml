name: Skillit
options:
  bundleIdPrefix: com.raven
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SkillitKit:
    path: SkillitKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.6
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.4.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # set to your Apple team before archiving for TestFlight
    DEVELOPMENT_TEAM: 5J5P965Q99
targets:
  Skillit:
    type: application
    platform: iOS
    sources: [Skillit]
    dependencies:
      - package: SkillitKit
      # Auth alone: the app never talks to Postgres, Storage or Realtime directly
      - package: Supabase
        product: Auth
      # the same ElevenLabs agents the headset talks to; voice runs over WebRTC with a server-issued token
      - package: ElevenLabs
    entitlements:
      path: Skillit/Resources/Skillit.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        # from Supabase > Project Settings > API; the publishable key is safe to ship, never the secret key
        SUPABASE_URL: "https://pgltmzicvpvcyhbrwqxz.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "sb_publishable_18neZMPxpE8pXm7waePiNQ_4sUdiJS1"
        PRODUCT_BUNDLE_IDENTIFIER: com.kostiailn.raven
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          RAVEN_API_URL: "http://localhost:8799"
        Release:
          RAVEN_API_URL: "https://htc-mentor.ilnkostia-dev.workers.dev"
    info:
      path: Skillit/Resources/Info.plist
      properties:
        CFBundleDisplayName: Skillit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RavenAPIURL: $(RAVEN_API_URL)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Skillit listens while you answer practice questions so the interviewer can respond to what you said.
        NSSpeechRecognitionUsageDescription: Skillit turns what you say into text so a quick update can be applied to your roadmap and profile.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
