<section class="section is-awwards" data-section="awards" data-section-color="black">
  <div class="blur-wrap"></div>
  <div class="container is-big">
    <div class="awards-wrap">
      <div class="section-heading">
        <h2 class="heading-2 text-align-center max-w-55">{{ respect.heading }}</h2>
        <div class="shadow vertical _2"></div>
      </div>
      <div class="awards-list">
        <div class="awards-list-item-wrap">
          <div class="awards-list-item r-respect-item">
            <h3 class="heading-5">{{ respect.cards.0.title }}</h3>
            <div class="awards-desc-2 r-respect-body">{{ respect.cards.0.body }}</div>
            <div class="awards-bg"></div>
          </div>
        </div>
        <div class="awards-list-item-wrap">
          <div class="awards-list-item r-respect-item">
            <h3 class="heading-5">{{ respect.cards.1.title }}</h3>
            <div class="awards-desc-2 r-respect-body">{{ respect.cards.1.body }}</div>
            <div class="awards-bg"></div>
          </div>
        </div>
        <div class="awards-list-item-wrap">
          <div class="awards-list-item r-respect-item">
            <h3 class="heading-5">{{ respect.cards.2.title }}</h3>
            <div class="awards-desc-2 r-respect-body">{{ respect.cards.2.body }}</div>
            <div class="awards-bg"></div>
          </div>
        </div>
        <div class="awards-list-item-wrap">
          <div class="awards-list-item r-respect-item">
            <h3 class="heading-5">{{ respect.cards.3.title }}</h3>
            <div class="awards-desc-2 r-respect-body">{{ respect.cards.3.body }}</div>
            <div class="awards-bg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
